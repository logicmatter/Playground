name: Bug Report
description: File a bug report
title: "[bug]: Title"
labels: "[bug, tbd]"
assignees: lmsupport@logicmatter.com
body:
- type: textarea
  id: b_what
  attributes:
    label: The issue
    description: Describe the issue in detail
    placeholder: ex. The scheduler fails on long processing raw data
  validations:
    required: true
  - type: textarea
    id: b_how
    attributes:
      label: How?
      description: Add screenshots and describe how to reproduce this issue
    validations:
      required: true
