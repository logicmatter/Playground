name: Bug Report
description: File a bug report
title: "[bug]: "
labels: "[bug, tbd]"
assignees: lmsupport@logicmatter.com
body:
type: dropdown
  attributes:
    label: Version
    description: What version of our software are you running?
    multiple: true
    options:
      - Platform
      - API
      - Portal
      - Manager
      - Flow
      - Apps
      - Templates
      - Builder
      - CLI
      - ReportingService
      - DatabaseServer
      - CloudInfra
      - Security
      - Unknown
  validations:
    required: true  
  - type: textarea
    id: b_what
    attributes:
      label: The issue
      description: Describe the issue in detail
      placeholder: ex. The scheduler fails on long processing raw data
    validations:
      required: true
  - type: textarea
    id: b_how
    attributes:
      label: How?
      description: Add screenshots and describe how to reproduce this issue
    validations:
      required: true
- type: markdown
  attributes:
    value: "## Thank you for contributing to our project!"
