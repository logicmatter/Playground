name: Bug Report
description: File a bug report
title: "[bug]: "
labels: ["bug", "triage"]
assignees: lmsupport@logicmatter.com
body:
  - type: input
    id: Brief description
    attributes:
      label: What is the issue
      description: Give a brief description for the bug
      placeholder: ex. [bug] The scheduler fails on long processing raw data
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: "A bug happened!"
    validations:
      required: true
