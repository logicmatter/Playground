name: 🐞Bug
description: File a bug or defect report against a release
title: "🐞[bug]: "
labels: [bug, tbd]
assignees:
  - "support-logicmatter"
body:
  - type: dropdown
    attributes:
      label: Framework Release
      description: What version of platform
      options:
        - PMFW 3.0.x (Default)
        - PMFW 3.1.x
        - PMFW 3.2.x
        - PMFW 3.3.x
        - PMFW 3.4.x
    validations:
      required: false
  - type: dropdown
    id: id-area
    attributes:
      label: Framework Components
      description: Which components are likely producting this defect?
      multiple: true
      options:
        - Unknown (Default)
        - Platform
        - Portal
        - Gateway
        - Connector
        - Scheduler
        - Flow
        - App
        - SLA
        - Manager
        - Template
        - DatabaseServer
        - Webserver
        - ReportServer
        - PMCloud
        - Builder
    validations:
      required: true
  - type: dropdown
    id: id-sys
    attributes:
      label: Solution componts
      description: What solution specific components have this issue?
      multiple: true
      options:
        - Report-Template
        - Dashboard-Template
        - Import-Template
        - Transform-Template
        - Export-Template
        - Maintin-Template
        - SLA-Template
        - Adhoc-Template
        - Datapicker-Config
        - Lookup-Sheet
        - Subscription-Sheet
        - Datasource-Config
        - Defined-Schedule
        - Defined-Report
        - Core-Parameters
        - Query-Performance
        - Report-Performance
        - User-Security
        - License
        - Unknown (Default)
    validations:
      required: true
- type: markdown
  attributes:
    value: |
      Describe in detail the bug ticket.
- type: textarea
  id: b_how
  attributes:
    label: Bug Description
    description: Describe the problem add screenshots and describe how to reproduce this issue
  validations:
    required: true
