name: Bug Report
description: File a bug report
title: "[bug]: "
labels: ["bug", "triage"]
assignees: lmsupport@logicmatter.com
body:
  - type: dropdown
    id: b_where
    attributes:
      label: Where is the issue found?
      options:
        - PMPortal
          labels: pmportal
        - PMManager
          labels: pmmanager
        - WMS
          labels: wms
        - BMS
          labels: bms
        - OEM
          labels: oem        
    validations:
      required: true  
  - type: textarea
    id: b_what
    attributes:
      label: What?
      description: Describe the issue in detail
      placeholder: ex. The scheduler fails on long processing raw data
    validations:
      required: true
  - type: textarea
    id: b_how
    attributes:
      label: How?
      description: Add screenshots and describe how to reproduce this issue
    validations:
      required: true
