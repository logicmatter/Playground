name: 🐞Bug
description: File a bug or defect report against a release
title: "🐞[bug]: "
labels: [bug, tbd]
assignees:
  - "support-logicmatter"
body:
- type: dropdown
  attributes:
    label: Framework Release
    description: What version of platform 
    options:
    - PMFW 3.0.x (Default)
    - PMFW 3.1.x
    - PMFW 3.2.x
    - PMFW 3.3.x
    - PMFW 3.4.x
  validations:
    required: false
- type: markdown
- type: dropdown
  id: id-area
  attributes: 
    label: Framework Components
    description: Which components are likely producting this defect?
    multiple: true
    options:
      - Unknown (Default)
      - Platform
      - Portal
      - Gateway
      - Connector
      - Scheduler
      - Flow
      - App
      - SLA
      - Manager
      - Template
      - DatabaseServer
      - Webserver
      - ReportServer
      - PMCloud
      - Builder
  validations:
    required: true
