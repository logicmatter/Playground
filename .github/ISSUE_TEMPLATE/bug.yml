name: Bug Report
description: File a bug report
title: "[bug]: "
labels: ["bug", "triage"]
assignees: lmsupport@logicmatter.com
body:
  - type: dropdown
    id: b_where
    attributes: ###
      label: Where is the issue found?
      options:
        - PMPortal
        - PMManager
        - WMS
        - BMS
        - OEM
    validations:
      required: true  
  - type: textarea
    id: b_what
    attributes:
      label: What?
      description: Describe the issue in detail
      placeholder: ex. The scheduler fails on long processing raw data
    validations:
      required: true
  - type: textarea
    id: b_how
    attributes:
      label: How?
      description: Add screenshots and describe how to reproduce this issue
    validations:
      required: true
- type: markdown
  attributes:
    value: "## Thank you for contributing to our project!"
- type: markdown
  attributes:
    value: |
      Thanks for taking the time to fill out this bug report.        
  - type: dropdown
    attributes: 
      label: Solution Version
      description: What version of the solution
      options:
        - BMS-Patch-General
        - BMS-Custom-Patch
        - OEM-Patch-General
        - OEM-Custom-Patch
        - WMS-Patch-General
        - WMS-Custom-Patch        
        - Other-Solution
      validations:
        required: true

