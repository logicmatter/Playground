name: Bug Report
description: File a bug report
title: "[bug]: "
labels: ["bug", "triage"]
assignees: lmsupport@logicmatter.com
body:
  - type: input
    id: b_what
    attributes:
      label: What is the issue
      description: Give a description for the bug
      placeholder: ex. [bug] The scheduler fails on long processing raw data
    validations:
      required: true
  - type: textarea
    id: b_how
    attributes:
      label: Enter detail steps to reproduce and/or screenshots
      description: Add screenshots or details on the issue steps
    validations:
      required: true
