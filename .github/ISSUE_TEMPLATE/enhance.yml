name: Enhance
description: Ticket describes changes to system without effecting the functionality implemented
title: "[enhance]: "
labels: ["enhance","tbd", "triage"]
body:
- type: dropdown
  id: id-area
  attributes: 
    label: Comonent-Refactored
    description: Which components are likely refactored for this enhancement ?
    multiple: true
    options:
      - Unknown (Default)
      - Platform
      - Portal
      - Gateway
      - Connector
      - Flow
      - Scheduler
      - Template
      - App
      - DatabaseServer
      - Webserver
      - ReportServer
      - PMCloud
      - Builder
  validations:
    required: true
- type: dropdown
  id: id-sys
  attributes: 
    label: Solution Version
    description: What version of the solution
    options:
      - Other-Soln (Default)
      - BMS-Soln-Release
      - OEM-Soln-Release
      - WMS-Soln-Release
      - BMS-Gen-Patch    
      - OEM-Gen-Patch
      - WMS-Gen-Patch
      - Custom-Release    
      - Custom-Patch
  validations:
    required: true
- type: checkboxes
  id: id-impact
  attributes:
    label: Impact of change
    description: Where would the impact be after this change is made
    options:
      - label: The patch or release applied would require production to be configured manually.
      - label: The patch or release changes the data structure and requires migrating production data manually.
      - label: This is architectural change and the platform or solution must include migration scripts for data structure in production.
      - label: This has no impact on the production system, other than verifying testing the system works as per the use case.
  validations:      
        required: true
- type: markdown
  id: id-where
  attributes:
    value: >
      What is being done?
      ---      
- type: textarea
  id: id-what
  attributes:
    label: Changes made
    description: What changes are being made?
    placeholder: Describe the changes being made in various components to support this enhancements.
  validations:
    required: true
