name: Enhance
description: Ticket describes changes to system without effecting the
  functionality implemented
body:
- type: dropdown
  id: location
  attributes: null
  label: Location of the Issue
  description: Where is the project located?
  multiple: true
  options:
    - Platform
    - Portal
    - Gateway
    - Connector
    - Flow
    - Scheduler
    - Template
    - App
    - DatabaseServer
    - Webserver
    - ReportServer
    - PMCloud
    - Builder
    - Somewhere else (please specify in the description!)
  validations:
    required: true
- type: markdown
  attributes:
    value: >
      Before opening a bug report, please search for the behaviour in the
      existing issues. 

      ---

      Thank you for taking the time to file a bug report. To address this bug as fast as possible, we need some information.
- type: input
  id: os
  attributes:
    label: Operating system
    description: Which operating system do you use? Please provide the version as well.
    placeholder: macOS Big Sur 11.5.2
  validations:
    required: true
- type: input
  id: laravel
  attributes:
    label: Laravel Version
    description: Please provide the full Laravel version of your project.
    placeholder: v8.6.1
  validations:
    required: true
- type: input
  id: php
  attributes: null
  label: PHP Version
  description: Please provide the full PHP version that is powering Tinkerwell.
  placeholder: "PHP 8.0.7, built: Jun  4 2021 01:50:04"
  validations:
    required: true
- type: textarea
  id: repro
  attributes: null
  label: Reproduction steps
  description: How do you trigger this bug? Please walk us through it step by step.
  value: |
    1.
    2.
    3.
    ...


