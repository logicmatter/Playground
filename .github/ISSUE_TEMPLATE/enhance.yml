name: Enhance
description: Ticket describes changes to system without effecting the functionality implemented
body:
- type: dropdown
  id: id-area
  attributes: 
    label: Location of the Issue
    description: Which components are likely refactored for this enhancement ?
    multiple: true
    options:
      - Unknown (Default)
      - Platform
      - Portal
      - Gateway
      - Connector
      - Flow
      - Scheduler
      - Template
      - App
      - DatabaseServer
      - Webserver
      - ReportServer
      - PMCloud
      - Builder
  validations:
    required: true
- type: dropdown
  id: id-sys
  attributes: 
    label: Solution Version
    description: What version of the solution
    multipart: false
    options:
      - Other-Soln (Default)
      - BMS-Soln-Release
      - OEM-Soln-Release
      - WMS-Soln-Release
      - BMS-Gen-Patch    
      - OEM-Gen-Patch
      - WMS-Gen-Patch
      - Custom-Release    
      - Custom-Patch
  validations:
    required: true




