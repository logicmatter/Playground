name: Enhance
description: Ticket describes changes to system without effecting the functionality implemented
body:
- type: dropdown
  id: location
  attributes: 
    label: Location of the Issue
    description: Where is the project located?
    multiple: true
      options:
        - Unknown (Default)
        - Platform
        - Portal
        - Gateway
        - Connector
        - Flow
        - Scheduler
        - Template
        - App
        - DatabaseServer
        - Webserver
        - ReportServer
        - PMCloud
        - Builder
    validations:
      required: true
