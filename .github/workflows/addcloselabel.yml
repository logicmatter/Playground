name: "Add-Close-Label"
on:
  issues:
    types:
      - closed
jobs:
  label_issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ["triage","DONE"]
            })
            if: ${{ github.event.label.name == 'OK' }}
               steps:
                - github.rest.issues.removeLabel({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    labels: ["OK"]
            })
            if: ${{ github.event.label.name == 'NEW' }}
               steps:
                - github.rest.issues.removeLabel({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    labels: ["NEW"]
            })
            if: ${{ github.event.label.name == 'QA' }}
               steps:
                - github.rest.issues.removeLabel({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    labels: ["QA"]
            })
            if: ${{ github.event.label.name == 'OPEN' }}
               steps:
                - github.rest.issues.removeLabel({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    labels: ["OPEN"]
            })
          
